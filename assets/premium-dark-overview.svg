    <text x="463" y="332" fill="#38BDF8" font-size="13" font-family="'Segoe UI', sans-serif" font-weight="600" letter-spacing="2">QUALITY</text>
    <text x="463" y="368" fill="#F8FAFC" font-size="24" font-family="Sora, 'Segoe UI', sans-serif" font-weight="700">Clean Engineering</text>
    <text x="463" y="396" fill="#94A3B8" font-size="15" font-family="'Segoe UI', sans-serif">Type-safe foundations, performance-aware</text>
