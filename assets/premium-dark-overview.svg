<svg width="1200" height="500" viewBox="0 0 1200 500" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Sadik Can Ceska professional profile overview</title>
  <desc id="desc">A dark premium six-card overview showing frontend, backend, delivery, product, quality, and mindset highlights.</desc>
  <defs>
    <linearGradient id="bg" x1="88" y1="28" x2="1094" y2="470" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="frame" x1="44" y1="46" x2="1160" y2="456" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1D4ED8" stop-opacity="0.8"/>
      <stop offset="0.5" stop-color="#334155" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(980 44) rotate(144) scale(340 220)">
      <stop stop-color="#2563EB" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#1E293B" stroke-opacity="0.42"/>
    </pattern>
  </defs>

  <rect width="1200" height="500" rx="34" fill="#020617"/>
  <rect width="1200" height="500" rx="34" fill="url(#bg)"/>
  <ellipse cx="980" cy="44" rx="260" ry="180" fill="url(#glow)"/>
  <rect width="1200" height="500" rx="34" fill="url(#grid)" opacity="0.46"/>
  <rect x="18" y="18" width="1164" height="464" rx="26" stroke="url(#frame)" stroke-width="1.5"/>

  <text x="62" y="62" fill="#E2E8F0" font-size="16" font-family="Sora, 'Segoe UI', sans-serif" font-weight="600" letter-spacing="3">
    ENGINEERING PROFILE
