    <text x="88" y="226" fill="#94A3B8" font-size="15" font-family="'Segoe UI', sans-serif">React and Next.js builds with sharp</text>
    <text x="88" y="248" fill="#94A3B8" font-size="15" font-family="'Segoe UI', sans-serif">interaction detail and scalable UI structure.</text>
