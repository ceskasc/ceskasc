<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Sadık Can Çeşka GitHub profil başlığı</title>
  <desc id="desc">Koyu, minimal ve Türkçe hazırlanmış GitHub profil başlığı.</desc>
  <defs>
    <linearGradient id="bg" x1="120" y1="32" x2="1084" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="stroke" x1="32" y1="24" x2="1168" y2="296" gradientUnits="userSpaceOnUse">
      <stop stop-color="#334155"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1010 54) rotate(145) scale(240 140)">
      <stop stop-color="#2563EB" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" rx="28" fill="#020617"/>
  <rect width="1200" height="320" rx="28" fill="url(#bg)"/>
  <ellipse cx="1010" cy="54" rx="240" ry="140" fill="url(#glow)"/>
  <rect x="18" y="18" width="1164" height="284" rx="20" stroke="url(#stroke)" stroke-width="1.5"/>

  <rect x="72" y="66" width="238" height="36" rx="18" fill="#0B1220" stroke="#1E293B"/>
  <text x="191" y="89" fill="#93C5FD" font-size="13" font-family="Segoe UI, sans-serif" font-weight="600" letter-spacing="2.2" text-anchor="middle">
    FULL STACK WEB GELİŞTİRİCİ
  </text>

  <text x="72" y="156" fill="#F8FAFC" font-size="52" font-family="Segoe UI, sans-serif" font-weight="700">
    Sadık Can Çeşka
  </text>

  <text x="72" y="204" fill="#CBD5E1" font-size="22" font-family="Segoe UI, sans-serif">
    Modern web ürünleri geliştiriyorum.
  </text>

  <text x="72" y="238" fill="#94A3B8" font-size="18" font-family="Segoe UI, sans-serif">
    React, Next.js, Node.js, PostgreSQL ve üretim odaklı mimari.
  </text>

  <line x1="72" y1="264" x2="264" y2="264" stroke="#2563EB" stroke-width="2"/>
</svg>
